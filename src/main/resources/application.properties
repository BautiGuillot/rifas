spring.application.name=rifas-backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.address=0.0.0.0
server.port=${PORT:8080}

spring.h2.console.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
app.comprobantes.storage=local
app.comprobantes.path=uploads/comprobantes
app.media.storage=local
app.media.path=uploads/media
app.media.public-base-url=
app.r2.shared-bucket=true
app.compras.expiracion-check-ms=30000
app.twilio.enabled=${TWILIO_ENABLED:false}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.webhook-base-url=${TWILIO_WEBHOOK_BASE_URL:}
app.twilio.validate-signature=${TWILIO_VALIDATE_SIGNATURE:true}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
