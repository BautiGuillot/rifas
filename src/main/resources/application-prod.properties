spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.super-admin.username=${SUPER_ADMIN_USERNAME}
app.super-admin.password=${SUPER_ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

app.comprobantes.storage=r2
app.comprobantes.r2.endpoint=${R2_ENDPOINT}
app.comprobantes.r2.bucket=${R2_BUCKET}
app.comprobantes.r2.access-key=${R2_ACCESS_KEY}
app.comprobantes.r2.secret-key=${R2_SECRET_KEY}
app.comprobantes.r2.region=${R2_REGION:auto}

app.media.storage=r2
app.media.public-base-url=
app.media.r2.endpoint=${R2_ENDPOINT}
app.media.r2.bucket=${R2_BUCKET}
app.media.r2.access-key=${R2_ACCESS_KEY}
app.media.r2.secret-key=${R2_SECRET_KEY}
app.media.r2.region=${R2_REGION:auto}
app.r2.shared-bucket=true

app.compras.expiracion-check-ms=${COMPRAS_EXPIRACION_CHECK_MS:30000}

app.twilio.enabled=${TWILIO_ENABLED:false}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.webhook-base-url=${TWILIO_WEBHOOK_BASE_URL:}
app.twilio.validate-signature=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
